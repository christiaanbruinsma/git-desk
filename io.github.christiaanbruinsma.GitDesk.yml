# Production / standalone release manifest.
app-id: io.github.christiaanbruinsma.GitDesk
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: git-desk

# Standalone GitHub bundles carry their gettext catalogs directly.
separate-locales: false

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/git-desk/cargo-home

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --filesystem=xdg-config/git:ro
  - --filesystem=xdg-cache/git:rw
  - --filesystem=~/.ssh:ro
  - --env=GIT_TERMINAL_PROMPT=0
  - --env=GIT_SSH_COMMAND=ssh -o BatchMode=yes
  - --talk-name=org.freedesktop.Flatpak

metadata:
  name: Git Desk
  summary: A native GNOME Git client
  description: |
    Git Desk is a powerful yet easy-to-use Git client designed for GNOME.
    It provides a clean, modern interface for managing your Git repositories
    with all the features you need for daily development.
  keywords:
    - git
    - version-control
    - development
    - programming
    - gnome
  categories:
    - Development;
    - VersionControl;
  icon: io.github.christiaanbruinsma.GitDesk

modules:
  - name: git-desk
    buildsystem: meson
    config-opts:
      - -Dprofile=production
    sources:
      - type: dir
        path: .

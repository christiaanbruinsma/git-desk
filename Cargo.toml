[package]
name = "git-desk"
version = "0.9.0"
edition = "2024"
description = "A native GNOME Git client"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3.10"
mockall = "0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
